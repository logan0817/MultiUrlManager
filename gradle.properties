# 复用 Android Studio 的 Gradle JVM；编译目标为 Java/Kotlin 17。
org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=true
# 保留现有兼容设置，后续仅在验证全部传递依赖后再决定是否移除 Jetifier。
android.enableJetifier=true
kotlin.code.style=official

# 根工程、库 publication 与消费验证共用版本；是否已发布以 Central 和发布记录为准。
APP_VERSION_NAME=1.1.0
APP_VERSION_CODE=7
APP_ID=com.logan.multiurlmanager
